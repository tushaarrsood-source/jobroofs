<svg width="1080" height="1350" viewBox="0 0 1080 1350" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Solid Color 1 (Background) -->
  <rect width="1080" height="1350" fill="#0D0D10" />

  <!-- Top Accent Wordmark & Domain -->
  <g transform="translate(540, 180)">
    <text x="0" y="0" text-anchor="middle" fill="#FAF8F5" fill-opacity="0.55" font-family="ui-monospace, monospace" font-size="13" font-weight="600" letter-spacing="4">JOBROOFS.COM</text>
    <line x1="-30" y1="20" x2="30" y2="20" stroke="#FAF8F5" stroke-opacity="0.35" stroke-width="1.5" />
  </g>

  <!-- Centered Optical Group: Logo Mark + Wordmark + Subline -->
  <g transform="translate(540, 640)">
    <!-- Architectural Chevron Mark (Jobroofs Mark: 1.5px rafter, beam, keystone) -->
    <g transform="translate(0, -95) scale(3.4)">
      <path d="M5 19L16 7L27 19" stroke="#FAF8F5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" transform="translate(-16, -16)" />
      <path d="M9.5 19H22.5" stroke="#FAF8F5" stroke-opacity="0.75" stroke-width="1.2" stroke-linecap="round" transform="translate(-16, -16)" />
      <circle cx="0" cy="-2.5" r="1.8" fill="#FAF8F5" />
    </g>

    <!-- Main Wordmark -->
    <text x="0" y="45" text-anchor="middle" fill="#FAF8F5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="800" letter-spacing="10">JOBROOFS</text>

    <!-- Subline (Non-negotiable) -->
    <text x="0" y="95" text-anchor="middle" fill="#FAF8F5" fill-opacity="0.85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" letter-spacing="5">THE PORTAL FOR TEMP JOBS</text>

    <!-- Subtle Divider -->
    <line x1="-40" y1="135" x2="40" y2="135" stroke="#FAF8F5" stroke-opacity="0.3" stroke-width="1.5" />
  </g>

  <!-- Bottom Subtitle / Manifest -->
  <g transform="translate(540, 1220)">
    <text x="0" y="0" text-anchor="middle" fill="#FAF8F5" fill-opacity="0.75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" letter-spacing="3">MINIJOBS • TEMP GIGS • DIRECT CONTACT</text>
  </g>
</svg>