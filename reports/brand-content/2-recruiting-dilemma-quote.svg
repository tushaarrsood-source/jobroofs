      </text>
    </g>
    <rect x="680" y="45" width="150" height="60" rx="14" fill="#09090b" />
    <text x="755" y="82" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="600">Inserieren</text>
  </g>
</svg>