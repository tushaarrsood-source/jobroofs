<svg width="1080" height="1350" viewBox="0 0 1080 1350" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1080" height="1350" fill="#09090b" />

  
  <!-- Official Jobroofs Logo Header -->
  <g transform="translate(100, 100)">
    <!-- Precision Hairline Roof Chevron (Jobroofs Architectural Mark) -->
    <g transform="translate(0, 4) scale(1.6)">
      <path d="M5 19L16 7L27 19" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M9.5 19H22.5" stroke="#a1a1aa" stroke-width="1.5" stroke-linecap="round" />
      <circle cx="16" cy="13.5" r="1.8" fill="#ffffff" />
    </g>
    <!-- Brand Wordmark -->
    <text x="65" y="32" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" letter-spacing="3.5">JOBROOFS</text>
    <text x="65" y="48" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="2.5">DAS PORTAL FÜR UNABHÄNGIGE BETRIEBE</text>
    <text x="880" y="36" text-anchor="end" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="14" font-weight="600" letter-spacing="2">JOBROOFS.COM</text>
  </g>
  <line x1="100" y1="185" x2="980" y2="185" stroke="#27272a" stroke-width="1.5" />
  

  <!-- Category Tag -->
  <g transform="translate(100, 235)">
    <rect width="250" height="42" rx="21" fill="#18181b" stroke="#27272a" stroke-width="1.5" />
    <text x="125" y="26" text-anchor="middle" fill="#10b981" font-family="ui-monospace, monospace" font-size="12" font-weight="700" letter-spacing="2">RECRUITING REALITÄT</text>
  </g>

  <!-- Huge Editorial Quote Statement -->
  <g transform="translate(100, 340)">
    <text x="0" y="70" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="58" font-weight="700" letter-spacing="-1.5" line-height="1.2">
      „Niemand unter 30
    </text>
    <text x="0" y="145" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="58" font-weight="700" letter-spacing="-1.5">
